<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Feedback</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
        .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 1.3rem; margin-bottom: 4px; }
        .sub { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; margin-top: 12px; }
        .stars { display: flex; gap: 4px; font-size: 1.8rem; cursor: pointer; }
        .stars span { color: #ddd; transition: color 0.15s; }
        .stars span.active { color: #ff9800; }
        input[type="range"] { width: 100%; margin: 4px 0; }
        .range-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; }
        textarea { width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; font-family: inherit; font-size: 0.9rem; resize: vertical; min-height: 60px; margin-top: 4px; }
        button { width: 100%; padding: 12px; background: #4caf50; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 16px; }
        button:active { background: #388e3c; }
        .val { font-weight: 700; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>How was your visit?</h2>
        <p class="sub">Your anonymous feedback helps us improve</p>
        <form method="post" action="/feedback/submit">
            <input type="hidden" name="store_owner" value="{{ store }}">

            <label>Overall Rating</label>
            <div class="stars" id="stars">
                {% for i in range(1, 11) %}
                <span data-val="{{ i }}" onclick="setStars({{ i }})">☆</span>
                {% endfor %}
            </div>
            <input type="hidden" name="overall" id="overall" value="5">

            <label>Value for Money: <span class="val" id="valDisp">5</span>/10</label>
            <input type="range" name="value" min="1" max="10" value="5" oninput="document.getElementById('valDisp').textContent=this.value">
            <div class="range-labels"><span>Poor</span><span>Excellent</span></div>

            <label>Product Range: <span class="val" id="rangeDisp">5</span>/10</label>
            <input type="range" name="range_rating" min="1" max="10" value="5" oninput="document.getElementById('rangeDisp').textContent=this.value">
            <div class="range-labels"><span>Limited</span><span>Excellent</span></div>

            <label>Service: <span class="val" id="svcDisp">5</span>/10</label>
            <input type="range" name="service" min="1" max="10" value="5" oninput="document.getElementById('svcDisp').textContent=this.value">
            <div class="range-labels"><span>Poor</span><span>Excellent</span></div>

            <label>Comments (optional)</label>
            <textarea name="comment" placeholder="Tell us more..."></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
    <script>
        function setStars(n) {
            document.getElementById('overall').value = n;
            document.querySelectorAll('#stars span').forEach((s, i) => {
                s.textContent = i < n ? '★' : '☆';
                s.classList.toggle('active', i < n);
            });
        }
        setStars(5);
    </script>
</body>
</html>

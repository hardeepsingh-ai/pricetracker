<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap">
    <title>{% block title %}PriceTracker{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .navbar {
            background: #111111;
            color: white;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            height: 56px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.06);
            border-bottom: 1px solid #222;
        }
        .navbar h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .navbar h1 span { color: #f5c518; }
        .navbar a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .navbar a:hover {
            color: #f5c518;
            background: rgba(245,197,24,0.08);
        }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }

        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: none;
            border: 1px solid #333;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #f5c518;
            color: #0a0a0a;
        }
        .btn-primary:hover {
            background: #e6b800;
            transform: translateY(-1px);
        }
        .btn-danger { background: #ff6b6b; color: white; }
        .btn-danger:hover { background: #ee5a5a; transform: translateY(-1px); }
        .btn-outline {
            background: transparent;
            border: 2px solid #f5c518;
            color: #f5c518;
        }
        .btn-outline:hover { background: rgba(245,197,24,0.08); }
        .btn-secondary {
            background: #222;
            color: #a0a0a0;
            border: 1px solid #333;
        }
        .btn-secondary:hover { background: #2a2a2a; color: #fff; }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            margin-bottom: 12px;
            transition: all 0.2s;
            background: #111;
            color: #fff;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #f5c518;
            background: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(245,197,24,0.12);
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .error-msg {
            background: rgba(239,68,68,0.1);
            color: #ff6b6b;
            padding: 10px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            border: 1px solid rgba(239,68,68,0.2);
        }

        .status-cheapest { color: #22c55e; font-weight: 700; }
        .status-mid_range { color: #f5c518; font-weight: 700; }
        .status-most_expensive { color: #ef4444; font-weight: 700; }
        .status-no_data { color: #666; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-green { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .badge-orange { background: rgba(245,197,24,0.15); color: #f5c518; }
        .badge-purple { background: rgba(168,85,247,0.15); color: #a855f7; }
        .badge-teal { background: rgba(20,184,166,0.15); color: #14b8a6; }

        .mono { font-family: 'JetBrains Mono', monospace; }

        @media (max-width: 600px) {
            .container { padding: 16px 12px; }
            .card { padding: 16px; border-radius: 12px; }
            .navbar { padding: 0 16px; }
            .nav-links { gap: 2px; }
            .navbar a { font-size: 0.75rem; padding: 4px 8px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
